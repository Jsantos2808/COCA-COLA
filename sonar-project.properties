sonar.organization=jsantos2808
sonar.projectKey=Jsantos2808_COCA-COLA
sonar.projectName=Coca-Cola Stock Portal

sonar.sources=backend/src,frontend
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**/*.test.js

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# El frontend es UI estatica sin Jest; no debe bajar el % de cobertura del Quality Gate.
sonar.exclusions=**/node_modules/**,**/coverage/**
sonar.coverage.exclusions=**/*.test.js,frontend/**
sonar.cpd.exclusions=frontend/**

sonar.sourceEncoding=UTF-8
